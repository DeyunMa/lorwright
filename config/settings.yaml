# 当前使用的英雄包（对应 src/lorwright/champions/<name>/）
champion: elise

screen:
  # 当前目标：BlueStacks 的 Pie64 实例（Android 9）
  # 手机旧值 2510x1156 已不适用；换分辨率后 layout 必须重标定
  width: 1280
  height: 720
  dpi_scale: 100
  # 游戏窗口标题关键字（用于定位窗口）
  window_title: "Legends of Runeterra"

perception:
  # 模板匹配阈值（0-1，越高越严格）
  match_threshold: 0.85
  # 截图保存目录
  snapshot_dir: "logs/snapshots"

loop:
  # 每轮循环间隔（毫秒）
  tick_ms: 200
  # 连续多少次动作后状态不变 → 判定卡住
  stuck_threshold: 3
  # 单次动作后等待状态变化的最长时间（秒）
  action_timeout_s: 8

logging:
  dir: "logs"
  # 按日期分目录
  by_date: true
  level: "INFO"

# 界面坐标（格式 [x, y, w, h]）
# 已按 Pie64 1280x720 实测标定（2026-11-03，截图 tests/fixtures/screens/720p_*.png）
# 换分辨率就要重标定，详见 docs/handoff.md §3.4
layout:
  end_turn:     [1120, 315, 88, 88]    # 右侧圆形动作按钮（略過/結束回合），蓝色占比 0.88 vs 暗态 0.00
  enemy_nexus:  [60, 230, 95, 90]      # 左上红色水晶（拖到这里 = 声明攻击）
  play_area:    [520, 330, 240, 160]   # 我方出牌落点（棋盘中部）
  hand_region:  [940, 580, 340, 140]   # 右下扇形手牌
  # 数字区域（perceive/digits.py 字形匹配）
  enemy_hp:     [145, 262, 45, 23]     # 敌方水晶旁数字
  my_hp:        [147, 433, 45, 23]     # 我方水晶旁数字
  mana:         [1112, 259, 22, 24]    # 动作按钮上方的当前法力

adb:
  enabled: true
  # BlueStacks Pie64 的端口；emulator-5554 是同一个实例的别名
  serial: 127.0.0.1:5555
  adb_path: adb
  package: com.riotgames.legendsofruneterra
