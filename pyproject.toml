[project]
name = "lorwright"
version = "0.1.0"
description = "Vision-based automation for Legends of Runeterra (Path of Champions)"
requires-python = ">=3.11"
dependencies = [
  "mss>=9.0",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pynput>=1.7",
  "pywin32>=306; sys_platform == 'win32'",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "loguru>=0.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
lorwright = "lorwright.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorwright"]
