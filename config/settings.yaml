screen:
  width: 1920
  height: 1080
  dpi_scale: 100
  # 游戏窗口标题关键字（用于定位窗口）
  window_title: "Legends of Runeterra"

perception:
  # 模板匹配阈值（0-1，越高越严格）
  match_threshold: 0.85
  # 截图保存目录
  snapshot_dir: "logs/snapshots"

loop:
  # 每轮循环间隔（毫秒）
  tick_ms: 200
  # 连续多少次动作后状态不变 → 判定卡住
  stuck_threshold: 3
  # 单次动作后等待状态变化的最长时间（秒）
  action_timeout_s: 8

logging:
  dir: "logs"
  # 按日期分目录
  by_date: true
  level: "INFO"

# 界面坐标（1080p 全屏，格式 [x, y, w, h]）
# 用 lorwright probe 截一张图，量出来填这里
layout:
  end_turn:      # 例: [1700, 900, 100, 60]
  enemy_nexus:   # 例: [880, 180, 140, 140]
  play_area:     # 例: [760, 380, 400, 300]
  hand_region:   # 例: [400, 900, 1120, 180]

# ADB 设备（手机 / 模拟器）
adb:
  enabled: true
  serial:            # 留空自动选第一个；多开时填 emulator-5554 / emulator-5556
  adb_path: adb
  package: com.riotgames.legendsofruneterra
