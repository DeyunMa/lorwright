name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 测试只依赖纯逻辑，不装 opencv / mss / pynput
      - run: pip install pytest loguru pydantic pyyaml
      - run: pytest
