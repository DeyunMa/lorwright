# 当前使用的英雄包（对应 src/lorwright/champions/<name>/）
champion: elise

screen:
  # 当前目标：BlueStacks 的 Pie64 实例（Android 9）
  # 逻辑分辨率用 `adb shell wm size 1920x1080` 抬高（模拟器原生 1280x720 时
  # 手牌费用数字只有 ~10px，读不出来）。换分辨率后 layout 必须重标定。
  # 这是**设计尺寸**：识别与坐标都按它标定，实际分辨率由 perceive/normalize.py
  # 归一化后反算回设备像素。改这里等于换一套标定。
  width: 1920
  height: 1080
  dpi_scale: 150
  # 游戏窗口标题关键字（用于定位窗口）
  window_title: "Legends of Runeterra"

perception:
  # 模板匹配阈值（0-1，越高越严格）
  match_threshold: 0.85
  # 截图保存目录
  snapshot_dir: "logs/snapshots"

act:
  # 出牌手势 = 按住 drag_hold_ms → 移动 drag_ms → 松手。
  # 不停顿会被 LoR 当成点击 / 长按预览（docs/handoff.md §4.6）。
  # 整段手势必须 < 2s，否则 LoR 当成「长按预览」：卡片放大但不跟手，松手回手牌
  drag_ms: 600
  drag_hold_ms: 120
  # 拖拽结束到画面稳定的等待
  drag_wait_ms: 600
  tap_wait_ms: 400
  # 点手牌 → 展开动画结束。收起态卡片拖不动，出牌前必须先展开
  expand_wait_ms: 500

loop:
  # 每轮循环间隔（毫秒）
  tick_ms: 200
  # 连续多少次动作后状态不变 → 判定卡住
  stuck_threshold: 3
  # 单次动作后等待状态变化的最长时间（秒）
  action_timeout_s: 8
  # 帧时效上限（秒）：截图+决策超时就不动，避免点在被过时的画面上
  max_frame_age_s: 2.0

recovery:
  # 允许重启游戏客户端。重启会回到 Riot 登入页（登录态被清），
  # 自动登录做好之前保持 false：卡住就停下等人，不盲动。
  allow_client_restart: false

logging:
  dir: "logs"
  # 按日期分目录
  by_date: true
  level: "INFO"

# 界面坐标（格式 [x, y, w, h]）
# 已按 Pie64 1920x1080 实测标定（2026-11-03，截图 tests/fixtures/screens/1080p_*.png）
# 换分辨率就要重标定，详见 docs/handoff.md §3.4
layout:
  end_turn:     [1680, 470, 132, 132]   # 右侧圆形动作按钮（略過/跳過/結束回合）
  enemy_nexus:  [91, 353, 128, 114]     # 左上红色水晶（血量区域，不是攻击落点）
  my_nexus:     [74, 626, 123, 100]     # 左下蓝色水晶
  play_area:    [860, 555, 200, 170]    # 我方出牌落点（分隔线以下）
  # 场上单位（perceive/units.py 靠攻击力徽章定位；两个模板各管一边）
  my_board:     [200, 820, 1500, 260]   # 我方单位卡面（徽章在左上角）
  enemy_board:  [200, 100, 1500, 200]   # 敌方单位卡面（徽章在下缘）
  # 攻击声明落点：拖单位到分隔线上方这一带，单位吸附到攻击行（实测 960,500）
  attack_row:   [700, 470, 520, 70]
  # 攻击令牌：动作按钮左侧的橙色箭头（实测有令牌 8446px / 无 30px）
  attack_token: [1640, 700, 140, 130]
  hand_region:  [1420, 855, 500, 225]   # 右下扇形手牌（收起态）；框要包住最上面那张卡的徽章
  hand_expanded: [200, 700, 1600, 380]  # 展开态手牌（tap 手牌后卡片平铺在下方）；收起态在这框里匹配不上
  # 数字区域（perceive/digits.py 字形匹配）
  enemy_hp:     [215, 390, 56, 40]      # 敌方水晶旁数字
  my_hp:        [216, 646, 56, 40]      # 我方水晶旁数字
  # 登录界面（1920x1080 实测）。账号密码从 .env 读。
  login_splash: [650, 790, 140, 90]        # 登入页的 Riot 按钮
  login_username: [110, 360, 1480, 190]
  login_password: [110, 580, 1480, 180]
  login_submit: [1580, 750, 280, 260]
  # 右侧有两个法力指示器：上排是对手，下排是我们。读错排会让 bot 以为没费而空过。
  mana:         [1650, 640, 50, 45]     # 我方当前法力（动作按钮下方）

adb:
  enabled: true
  # BlueStacks Pie64 的端口；emulator-5554 是同一个实例的别名
  serial: 127.0.0.1:5555
  adb_path: adb
  package: com.riotgames.legendsofruneterra
