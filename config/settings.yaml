# 当前使用的英雄包（对应 src/lorwright/champions/<name>/）
champion: elise

screen:
  # 当前目标：BlueStacks 的 Pie64 实例（Android 9）
  # 手机旧值 2510x1156 已不适用；换分辨率后 layout 必须重标定
  width: 1280
  height: 720
  dpi_scale: 100
  # 游戏窗口标题关键字（用于定位窗口）
  window_title: "Legends of Runeterra"

perception:
  # 模板匹配阈值（0-1，越高越严格）
  match_threshold: 0.85
  # 截图保存目录
  snapshot_dir: "logs/snapshots"

loop:
  # 每轮循环间隔（毫秒）
  tick_ms: 200
  # 连续多少次动作后状态不变 → 判定卡住
  stuck_threshold: 3
  # 单次动作后等待状态变化的最长时间（秒）
  action_timeout_s: 8

logging:
  dir: "logs"
  # 按日期分目录
  by_date: true
  level: "INFO"

# 界面坐标（格式 [x, y, w, h]）
# ⚠️ 下面四个矩形全部是**手机 2510x1156** 实测值，在 Pie64 1280x720 下**全部作废**。
# 用 lorwright shot --grid 截图量出来后替换。详见 docs/handoff.md §3.4
layout:
  # 小米 2510DRK44C 横屏实测（2510x1156）—— 仅供对照，不要直接用
  end_turn:     [2035, 487, 138, 138]   # 右侧蓝色动作按钮（略過/結束回合）
  enemy_nexus:  [329, 372, 80, 80]      # 左上红色水晶
  play_area:    [900, 750, 700, 200]    # 我方出牌落点
  hand_region:  [1750, 940, 740, 210]   # 右下扇形手牌

adb:
  enabled: true
  # BlueStacks Pie64 的端口；emulator-5554 是同一个实例的别名
  serial: 127.0.0.1:5555
  adb_path: adb
  package: com.riotgames.legendsofruneterra
