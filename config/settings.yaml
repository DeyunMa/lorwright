# 当前使用的英雄包（对应 src/lorwright/champions/<name>/）
champion: elise

screen:
  # 当前目标：BlueStacks 的 Pie64 实例（Android 9）
  # 逻辑分辨率用 `adb shell wm size 1920x1080` 抬高（模拟器原生 1280x720 时
  # 手牌费用数字只有 ~10px，读不出来）。换分辨率后 layout 必须重标定。
  width: 1920
  height: 1080
  dpi_scale: 150
  # 游戏窗口标题关键字（用于定位窗口）
  window_title: "Legends of Runeterra"

perception:
  # 模板匹配阈值（0-1，越高越严格）
  match_threshold: 0.85
  # 截图保存目录
  snapshot_dir: "logs/snapshots"

act:
  # LoR 手机版只认「慢拖」：700~900ms 的 swipe 会被当成滑动取消，
  # 2000ms 才稳定触发出牌（2026-11-03 在 Pie64 实测）。
  drag_ms: 2000
  # 拖拽结束到画面稳定的等待
  drag_wait_ms: 600
  tap_wait_ms: 400

loop:
  # 每轮循环间隔（毫秒）
  tick_ms: 200
  # 连续多少次动作后状态不变 → 判定卡住
  stuck_threshold: 3
  # 单次动作后等待状态变化的最长时间（秒）
  action_timeout_s: 8

recovery:
  # 允许重启游戏客户端。重启会回到 Riot 登入页（登录态被清），
  # 自动登录做好之前保持 false：卡住就停下等人，不盲动。
  allow_client_restart: false

logging:
  dir: "logs"
  # 按日期分目录
  by_date: true
  level: "INFO"

# 界面坐标（格式 [x, y, w, h]）
# 已按 Pie64 1920x1080 实测标定（2026-11-03，截图 tests/fixtures/screens/1080p_*.png）
# 换分辨率就要重标定，详见 docs/handoff.md §3.4
layout:
  end_turn:     [1680, 470, 132, 132]   # 右侧圆形动作按钮（略過/跳過/結束回合）
  enemy_nexus:  [91, 353, 128, 114]     # 左上红色水晶（拖到这里 = 声明攻击）
  my_nexus:     [74, 626, 123, 100]     # 左下蓝色水晶
  play_area:    [860, 555, 200, 170]    # 我方出牌落点（分隔线以下）
  hand_region:  [1420, 855, 500, 225]   # 右下扇形手牌（收起态）；框要包住最上面那张卡的徽章
  # 数字区域（perceive/digits.py 字形匹配）
  enemy_hp:     [215, 390, 56, 40]      # 敌方水晶旁数字
  my_hp:        [216, 646, 56, 40]      # 我方水晶旁数字
  mana:         [1668, 388, 33, 36]     # 动作按钮上方的当前法力

adb:
  enabled: true
  # BlueStacks Pie64 的端口；emulator-5554 是同一个实例的别名
  serial: 127.0.0.1:5555
  adb_path: adb
  package: com.riotgames.legendsofruneterra
